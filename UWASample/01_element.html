<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>01. DOM (Element, Event)</title>
  <script type="text/javascript" src="../AmdLoader/AmdLoader.js"></script>
  <style>
    html, body { margin: 0; font-family: sans-serif; }
    .page { padding: 12px; }
    .page h2 { margin: 0 0 8px; font-size: 16px; }
    .page h3 { margin: 16px 0 8px; font-size: 14px; }
    .page p { margin: 0 0 8px; font-size: 12px; color: #555; }
    .part-box { border: 1px solid #d1d4d4; margin-bottom: 8px; }
    .part-box.released { background: #eef8ee; }
    .item { padding: 4px 8px; cursor: pointer; }
    .item:hover { background: #f0f4f8; }
    .red { color: #c00; }
    #compare { font: 12px monospace; white-space: pre-wrap; background: #fafafa; border: 1px solid #d1d4d4; padding: 6px; }
    #log { height: 140px; overflow: auto; border: 1px solid #d1d4d4; padding: 6px; font: 12px monospace; background: #fafafa; }
  </style>
</head>
<body>
  <div class="page">
    <h2>01. DOM (Element, Event)</h2>
    <p>UWA.createElement 와 요소 메서드, 이벤트를 확인합니다. <a href="index.html">목록으로</a></p>

    <h3>createElement (중첩 자식, styles, events)</h3>
    <div id="boxArea"></div>

    <h3>이벤트 위임 ('click .item')</h3>
    <div id="listArea"></div>

    <h3>잘못된 키 비교 (만들어진 HTML)</h3>
    <div id="compare"></div>

    <h3>로그</h3>
    <div id="log"></div>
  </div>

  <script type="text/javascript">
    require(['UWA/Core', 'UWA/Element', 'UWA/Event'], function (UWA, Element, UWAEvent) {
      'use strict';

      var logEl = document.getElementById('log');

      function log(text) {
        logEl.textContent = new Date().toLocaleTimeString() + '  ' + text + '\n' + logEl.textContent;
      }

      /* [1] createElement: 'class', styles, html 배열, events */
      var stateSpan;
      var box = UWA.createElement('div', {
        'class': 'part-box',
        styles: { padding: 8, width: 320 },
        html: [
          { tag: 'strong', text: 'PRT-0001 브라켓' },
          ' ',
          stateSpan = UWA.createElement('span', { text: '작업중' }),
          ' ',
          {
            tag: 'button',
            text: '승인 토글',
            events: {
              click: function () {
                box.toggleClassName('released');
                stateSpan.setText(box.hasClassName('released') ? '승인' : '작업중');
                log('toggleClassName → ' + box.className);
              }
            }
          }
        ]
      }).inject(document.getElementById('boxArea'));

      /* [2] 이벤트 위임: 하위 .item 클릭을 한 곳에서. getElement(e) = 선택자에 맞은 요소 */
      var list = UWA.createElement('div', { 'class': 'part-box' }).inject(document.getElementById('listArea'));
      ['PRT-0001', 'PRT-0002', 'PRT-0003'].forEach(function (id) {
        UWA.createElement('div', { 'class': 'item', text: id + ' 클릭', data: { id: id } }).inject(list);
      });
      list.addEvent('click .item', function (e) {
        var item = UWAEvent.getElement(e);
        log('위임 클릭 data-id = ' + item.getData('id'));
      });

      /* [3] 잘못된 키: className, style 은 동작하지 않음 → 'class', styles */
      var wrong = UWA.createElement('div', { className: 'red', style: { fontWeight: 'bold' }, text: 'wrong' });
      var right = UWA.createElement('div', { 'class': 'red', styles: { fontWeight: 'bold' }, text: 'right' });
      document.getElementById('compare').textContent =
        '{ className, style }  → ' + wrong.outerHTML + '\n' +
        "{ 'class', styles }   → " + right.outerHTML;

      /* [4] 요소는 'click', 'onClick' 은 실행되지 않음 */
      var btn = UWA.createElement('button', { text: "addEvent('click') / addEvent('onClick')" })
        .inject(document.getElementById('boxArea'));
      btn.addEvent('click', function () { log("'click' 핸들러 실행"); });
      btn.addEvent('onClick', function () { log("'onClick' 핸들러 실행 (나오면 안 됨)"); });

      /* [5] destroy: 이벤트까지 정리 */
      UWA.createElement('button', {
        text: '목록 destroy',
        events: {
          click: function () {
            list.destroy();
            log('list.destroy() 완료');
          }
        }
      }).inject(document.getElementById('listArea'));
    });
  </script>
</body>
</html>
