<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>12. 헤더와 컬럼</title>
  <link rel="stylesheet" type="text/css" href="../Core/wux.css" />
  <script type="text/javascript" src="../AmdLoader/AmdLoader.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    .page { display: flex; flex-direction: column; height: 100%; padding: 12px; box-sizing: border-box; }
    .page h2 { margin: 0 0 8px; font-size: 16px; }
    .page p { margin: 0 0 8px; font-size: 12px; color: #555; }
    .buttons { margin: 0 0 8px; font-size: 12px; }
    .buttons button { margin-right: 4px; }
    .buttons label { margin-right: 10px; }
    .buttons input[type="number"] { width: 56px; }
    .buttons b { display: inline-block; width: 72px; }
    #grid { position: relative; flex: 1; min-height: 300px; border: 1px solid #d1d4d4; }
    #log { height: 120px; margin: 8px 0 0; padding: 8px; overflow: auto; font-size: 12px; background: #f4f5f6; border: 1px solid #d1d4d4; }
    .required-header { display: flex; align-items: center; height: 100%; padding: 0 6px; }
    .required-header .mark { margin-left: 4px; color: #e31c3d; font-weight: bold; }
  </style>
</head>
<body>
  <div class="page">
    <h2>12. 헤더와 컬럼 (헤더 높이, 2단 헤더, 헤더 직접 그리기, 만든 뒤 컬럼 바꾸기)</h2>
    <p>
      "치수" 는 컬럼 그룹(2단 헤더)이고 헤더의 펼침 버튼으로 접고 펼칩니다. "비고 헤더 직접 그리기" 를 켜면 비고 헤더에 필수 표시(*)가 붙습니다.
      <a href="index.html">목록으로</a>
    </p>
    <div class="buttons">
      <b>헤더</b>
      <label>높이 <input type="number" id="headerHeight" value="27" /> <button id="btnHeight">적용</button></label>
      <label><input type="checkbox" id="chkColumnsHeader" checked /> columnsHeader</label>
      <label><input type="checkbox" id="chkRowsHeader" checked /> rowsHeader</label>
      <label><input type="checkbox" id="chkRowIndex" checked /> showRowIndexFlag</label>
      <button id="btnRename">상태 헤더 글자 바꾸기</button>
      <button id="btnToggleGroup">치수 그룹 펼치기 / 접기</button>
      <label><input type="checkbox" id="chkCustomHeader" /> 비고 헤더 직접 그리기 (customHeader)</label>
    </div>
    <div class="buttons">
      <b>컬럼</b>
      <button id="btnToggleQty">수량 숨기기 / 보이기</button>
      <button id="btnWidth">품명 너비 240</button>
      <button id="btnPin">상태 왼쪽 고정 / 해제</button>
      <button id="btnMove">수량을 품명 앞으로</button>
      <button id="btnFit">너비를 내용에 맞춤</button>
      <button id="btnDump">지금 컬럼 순서 보기</button>
    </div>
    <div id="grid"></div>
    <pre id="log"></pre>
  </div>

  <script type="text/javascript">
    require([
      'DS/DataGridView/DataGridView',
      'DS/TreeModel/TreeDocument',
      'DS/TreeModel/TreeNodeModel'
    ], function (DataGridView, TreeDocument, TreeNodeModel) {
      'use strict';

      function writeLog(text) {
        var log = document.getElementById('log');
        log.textContent = text + '\n' + log.textContent;
      }

      var treeDocument = new TreeDocument();
      treeDocument.prepareUpdate();
      [
        { label: 'PRT-0001', title: '브라켓', status: '작업중', width: 120, height: 80, depth: 6, qty: 10, note: '도면 수정 중' },
        { label: 'PRT-0002', title: '샤프트', status: '검토중', width: 300, height: 25, depth: 25, qty: 4, note: '' },
        { label: 'PRT-0003', title: '하우징', status: '승인', width: 220, height: 180, depth: 90, qty: 1, note: '양산 적용' },
        { label: 'PRT-0004', title: '커버', status: '작업중', width: 220, height: 180, depth: 3, qty: 2, note: '' },
        { label: 'PRT-0005', title: '베어링', status: '승인', width: 47, height: 47, depth: 14, qty: 8, note: '규격품' }
      ].forEach(function (row) {
        treeDocument.addRoot(new TreeNodeModel({
          label: row.label,
          grid: {
            title: row.title, status: row.status, qty: row.qty, note: row.note,
            width: row.width, height: row.height, depth: row.depth,
            sizeText: row.width + ' × ' + row.height + ' × ' + row.depth
          }
        }));
      });
      treeDocument.pushUpdate();

      /*
       * [1] 헤더 글자, 아이콘, 툴팁
       *   text         헤더 글자
       *   icon         헤더 아이콘. '아이콘명' 또는 { iconName, fontIconFamily }
       *   showTextFlag false 면 글자를 숨기고 아이콘만 보인다
       *   description  헤더에 마우스를 올렸을 때의 툴팁
       */
      // #region text
      var statusColumn = {
        text: '상태',
        dataIndex: 'status',
        width: 90,
        icon: { iconName: 'flag', fontIconFamily: 1 },
        description: '결재 상태 (작업중 / 검토중 / 승인)'
      };
      var qtyColumn = { text: '수량', dataIndex: 'qty', width: 80, typeRepresentation: 'integer', alignment: 'far' };
      // #endregion text

      /*
       * [2] 헤더를 2단으로 묶기 (컬럼 그룹)
       *   children        이 컬럼은 그룹 헤더가 되고 children 의 컬럼이 그 아래 줄에 놓인다
       *   expandedFlag    그룹에 넣는다. 넣으면 그룹 헤더에 펼침 버튼이 생긴다 (true = 처음에 펼침)
       *   columnGroupShow 하위 컬럼에 넣는다. 'open' = 펼쳤을 때만, 'closed' = 접었을 때만 보인다. 없으면 항상 보인다
       *   그룹의 dataIndex 는 값과 연결되지 않고, 나중에 그룹을 찾을 때 쓰는 이름이다.
       */
      // #region group
      var sizeGroup = {
        text: '치수 (mm)',
        dataIndex: 'sizeGroup',
        expandedFlag: false,
        children: [
          { text: '요약', dataIndex: 'sizeText', width: 150, columnGroupShow: 'closed' },
          { text: '가로', dataIndex: 'width', width: 70, typeRepresentation: 'integer', columnGroupShow: 'open' },
          { text: '세로', dataIndex: 'height', width: 70, typeRepresentation: 'integer', columnGroupShow: 'open' },
          { text: '두께', dataIndex: 'depth', width: 70, typeRepresentation: 'integer', columnGroupShow: 'open' }
        ]
      };
      // #endregion group

      /*
       * [3] 헤더를 직접 그리기 (customHeader)
       *   buildContent(cellInfos)  헤더 칸에 넣을 DOM 요소를 만들어 돌려준다 (필수)
       *   updateContent(content, { sortModel, filterModel })  헤더를 다시 그릴 때마다 호출 (선택)
       *   맨 아래 줄 헤더에만 적용된다.
       *
       *   customHeader 컬럼이 하나라도 있으면 맨 아래 헤더 줄은 columnHeaderHeight 를 따르지 않는다.
       *   그 줄 높이는 "행 기본 높이(cellHeight)와 직접 그린 내용 높이 중 큰 값" 이 된다. (체크박스를 켠 뒤 헤더 높이를 바꿔 보면 그룹 줄만 바뀐다)
       *   이 샘플은 체크박스로 켜고 끌 수 있게 컬럼 정의에 나중에 붙이고 applyColumns() 로 반영한다.
       *   처음부터 쓸 때는 컬럼 정의에 customHeader: { buildContent: ... } 를 바로 넣으면 된다.
       */
      // #region custom
      var requiredHeader = {
        buildContent: function (cellInfos) {
          var box = document.createElement('div');
          var label = document.createElement('span');
          var mark = document.createElement('span');
          box.className = 'required-header';
          label.textContent = '비고';
          mark.className = 'mark';
          mark.textContent = '*';
          box.appendChild(label);
          box.appendChild(mark);
          return box;
        }
      };
      var noteColumn = { text: '비고', dataIndex: 'note', width: 180, editableFlag: true };
      // #endregion custom

      /*
       * [4] 그리드와 헤더 높이
       *   헤더 높이는 그리드 옵션이 아니라 layoutOptions 안에 넣는다. 기본 27, 27 보다 작은 값은 27 로 되돌아간다.
       *   2단 헤더면 줄마다 이 높이가 된다.
       */
      // #region grid
      var grid = new DataGridView({
        treeDocument: treeDocument,
        columnSelection: 'none',
        layoutOptions: { columnHeaderHeight: 27 },
        columns: [
          { text: '품번', dataIndex: 'tree', width: 130 },
          { text: '품명', dataIndex: 'title', width: 140 },
          statusColumn,
          sizeGroup,
          qtyColumn,
          noteColumn
        ]
      });
      grid.inject(document.getElementById('grid'));
      // #endregion grid

      window.sample = { grid: grid, treeDocument: treeDocument };

      /*
       * [5] 만든 뒤에 헤더 높이 바꾸기, 헤더 숨기기
       *   layoutOptions 의 키는 만든 뒤에 grid.layout.키 = 값 으로 바꾼다.
       *   getColumnHeaderHeight()    헤더 한 줄의 높이
       *   getHeaderContainerHeight() 헤더 전체 높이 (2단이면 두 줄 합계)
       */
      // #region height
      document.getElementById('btnHeight').addEventListener('click', function () {
        grid.layout.columnHeaderHeight = Number(document.getElementById('headerHeight').value);
        writeLog('columnHeaderHeight = ' + grid.layout.columnHeaderHeight
          + ', 한 줄 ' + grid.layout.getColumnHeaderHeight() + 'px'
          + ', 헤더 전체 ' + grid.layout.getHeaderContainerHeight() + 'px');
      });
      // #endregion height

      // #region hide
      document.getElementById('chkColumnsHeader').addEventListener('change', function (event) {
        grid.layout.columnsHeader = event.target.checked;
      });
      document.getElementById('chkRowsHeader').addEventListener('change', function (event) {
        grid.layout.rowsHeader = event.target.checked;
      });
      document.getElementById('chkRowIndex').addEventListener('change', function (event) {
        grid.showRowIndexFlag = event.target.checked;
      });
      // #endregion hide

      // #region customToggle
      document.getElementById('chkCustomHeader').addEventListener('change', function (event) {
        var column = grid.layout.getColumnOrGroup('note');
        column.customHeader = event.target.checked ? requiredHeader : undefined;
        grid.layout.applyColumns();
        writeLog('customHeader ' + (event.target.checked ? '켬' : '끔')
          + ', 헤더 전체 ' + grid.layout.getHeaderContainerHeight() + 'px');
      });
      // #endregion customToggle

      /*
       * [6] 만든 뒤에 헤더 글자 바꾸기
       *   컬럼 정의 객체를 직접 고치지 않고 setColumnOrGroupProperties(컬럼, { 바꿀 키 }) 를 쓴다. 그 헤더 칸만 다시 그린다.
       */
      // #region rename
      document.getElementById('btnRename').addEventListener('click', function () {
        var column = grid.layout.getColumnOrGroup('status');
        var nextText = column.text === '상태' ? '진행 상태' : '상태';
        grid.layout.setColumnOrGroupProperties('status', { text: nextText, description: '헤더 글자를 코드로 바꿨습니다' });
        writeLog('상태 컬럼 헤더 → ' + nextText);
      });
      // #endregion rename

      /*
       * [7] 컬럼 그룹을 코드로 접고 펼치기
       *   setColumnGroupExpandedFlag(rowID, columnID, 펼침여부) 의 rowID, columnID 는 그룹 헤더 칸의 위치다.
       *   getColumnOrGroupCellCoordinates(그룹 정의 객체) 로 얻는다.
       *   코드로 바꾸면 컬럼은 바로 접히고 펼쳐지지만 그룹 헤더 칸의 펼침 버튼 모양은 그대로 남는다.
       *   그래서 그룹 헤더 칸을 updateCellView 로 한 번 다시 그린다. (다시 그리지 않으면 사용자가 버튼을 두 번 눌러야 한다)
       */
      // #region groupToggle
      document.getElementById('btnToggleGroup').addEventListener('click', function () {
        var group = grid.layout.getColumnOrGroup('sizeGroup');
        var position = grid.layout.getColumnOrGroupCellCoordinates(group);
        grid.layout.setColumnGroupExpandedFlag(position.rowID, position.columnID, !group.expandedFlag);
        grid.updateCellView(grid.layout.getCellIDFromCoordinates(position), {
          updateCellContent: true,
          updateCellLayout: false,
          updateCellAttributes: false
        });
      });
      // #endregion groupToggle

      /*
       * [8] 만든 뒤에 컬럼 다루기 (grid.layout)
       *   컬럼은 dataIndex 문자열이나 컬럼 번호로 가리킨다.
       *   setColumnVisibleFlag / setColumnWidth / setColumnPinned / moveColumn
       *   마지막 인자에 { isUserInteraction: true } 를 주면 사용자가 직접 바꾼 것처럼 화면 상태 저장에 기록된다.
       */
      // #region columnActions
      document.getElementById('btnToggleQty').addEventListener('click', function () {
        grid.layout.setColumnVisibleFlag('qty', !grid.layout.getColumnVisibleFlag('qty'));
      });
      document.getElementById('btnWidth').addEventListener('click', function () {
        grid.layout.setColumnWidth('title', 240);
      });
      document.getElementById('btnPin').addEventListener('click', function () {
        var pinned = grid.layout.getColumnPinned('status');
        grid.layout.setColumnPinned('status', pinned === 'left' ? 'unpinned' : 'left');
      });
      document.getElementById('btnMove').addEventListener('click', function () {
        var moved = grid.layout.moveColumn('qty', 'title', { insertBeforeOrAfter: 'before' });
        writeLog('moveColumn 결과: ' + moved);
      });
      document.getElementById('btnFit').addEventListener('click', function () {
        grid.sizeAllColumnsToFit();
      });
      // #endregion columnActions

      /*
       * [9] 컬럼 목록 읽기
       *   getLeafColumns()               값을 보여 주는 컬럼 전체. 배열 순번 = 컬럼 번호 (순서를 바꿔도 변하지 않는다)
       *   getVisibleOrderedLeafColumns() 지금 보이는 컬럼만, 화면 순서대로
       */
      // #region read
      document.getElementById('btnDump').addEventListener('click', function () {
        var all = grid.layout.getLeafColumns().map(function (column, columnIndex) {
          return columnIndex + ':' + column.dataIndex;
        });
        var visible = grid.layout.getVisibleOrderedLeafColumns().map(function (column) {
          return column.dataIndex;
        });
        writeLog('컬럼 번호: ' + all.join(', ') + '\n화면 순서: ' + visible.join(', '));
      });
      // #endregion read

      /*
       * [10] 컬럼이 바뀔 때 받는 이벤트
       */
      // #region events
      grid.addEventListener('columnGroupExpandedState', function (event) {
        writeLog('columnGroupExpandedState: ' + JSON.stringify(event.options));
      });
      grid.addEventListener('columnVisibleStateChange', function (event) {
        writeLog('columnVisibleStateChange: ' + JSON.stringify(event.options));
      });
      grid.addEventListener('columnWidthChange', function (event) {
        writeLog('columnWidthChange: ' + JSON.stringify(event.options));
      });
      grid.addEventListener('columnOrderChange', function () {
        writeLog('columnOrderChange');
      });
      // #endregion events
    });
  </script>
</body>
</html>
