<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>05. DataGridView 실시간 설정</title>
  <link rel="stylesheet" type="text/css" href="../Core/wux.css" />
  <script type="text/javascript" src="../AmdLoader/AmdLoader.js"></script>
  <style>
    html, body { margin: 0; font-family: sans-serif; font-size: 13px; color: #222; background: #fff; }
    .top { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #d1d4d4; padding: 10px 16px; }
    .top h1 { display: inline-block; margin: 0 16px 0 0; font-size: 18px; }
    .top a { margin-right: 12px; }
    main { padding: 0 16px 40px; }
    h2 { margin: 28px 0 8px; font-size: 16px; border-left: 4px solid #368ec4; padding-left: 8px; }
    p.desc { margin: 0 0 8px; color: #555; }
    .play { display: flex; gap: 12px; align-items: stretch; }
    .play .controls { width: 330px; flex: none; border: 1px solid #d1d4d4; padding: 8px; max-height: 620px; overflow: auto; }
    .play .controls fieldset { margin: 0 0 8px; padding: 4px 8px 6px; border: 1px solid #e2e4e6; }
    .play .controls legend { font-weight: bold; }
    .play .controls label { display: flex; justify-content: space-between; align-items: center; margin: 3px 0; }
    .play .controls label span { font-family: Consolas, monospace; font-size: 12px; }
    .play .controls select, .play .controls input[type=number] { width: 120px; }
    .play .right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #playGrid { position: relative; height: 340px; border: 1px solid #d1d4d4; }
    #playCode { flex: 1; margin: 8px 0 0; padding: 8px; min-height: 200px; overflow: auto; font-size: 12px; background: #f4f5f6; border: 1px solid #d1d4d4; white-space: pre; }
    .logHead { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-weight: bold; }
    #playLog { height: 160px; margin: 4px 0 0; padding: 8px; overflow: auto; font-size: 12px; background: #1e1e1e; color: #d4d4d4; white-space: pre; }
  </style>
</head>
<body>
  <div class="top">
    <h1>05. DataGridView 실시간 설정</h1>
    <a href="index.html">목록으로</a>
    <a href="https://leeouhyoun.github.io/sampleCodesAndMemos/datagridview/api/grid-options" target="_blank">옵션 전체 설명 (사양서)</a>
  </div>

  <main>
    <!--
      왼쪽에서 값을 바꾸면 그리드를 같은 설정으로 다시 생성하고, 그 설정 코드를 아래에 보여준다.
      옵션 설명 표는 사양서 사이트(docs/datagridview/api)로 옮겼다.
    -->

    <h2 id="sec-play">실시간 설정</h2>
    <p class="desc">왼쪽 값을 바꾸면 그리드를 새 설정으로 다시 만듭니다. 아래 코드 영역에는 지금 그리드를 만든 <b>new DataGridView({...})</b> 설정이 그대로 표시됩니다.</p>
    <div class="play">
      <div class="controls" id="controls">
        <fieldset>
          <legend>행 높이 (layoutOptions)</legend>
          <label><span>cellHeight</span><input type="number" data-opt="layout.cellHeight" value="26" min="26" step="2" /></label>
          <label><span>layoutDensity</span><select data-opt="layout.layoutDensity"><option>compact</option><option>comfortable</option></select></label>
          <label><span>rowSpacing</span><input type="number" data-opt="layout.rowSpacing" value="0" min="0" /></label>
          <label><span>columnHeaderHeight</span><input type="number" data-opt="layout.columnHeaderHeight" value="27" min="27" /></label>
          <label><span>columnsHeader</span><input type="checkbox" data-opt="layout.columnsHeader" checked /></label>
          <label><span>rowsHeader</span><input type="checkbox" data-opt="layout.rowsHeader" checked /></label>
          <label><span>getRowHeightFunction<br/>(짝수 행 50px)</span><input type="checkbox" data-opt="special.rowHeightFn" /></label>
          <label><span>비고 컬럼 autoRowHeightFlag</span><input type="checkbox" data-opt="special.autoRowHeight" /></label>
        </fieldset>
        <fieldset>
          <legend>편집 (컬럼 editionPolicy)</legend>
          <label><span>editionPolicy</span>
            <select data-opt="special.editionPolicy">
              <option>EditionOnDoubleClick</option>
              <option>EditionOnClick</option>
              <option>DelayedEditionOnClick</option>
              <option>EditionOnOver</option>
              <option>EditionInPlace</option>
            </select>
          </label>
          <label><span>담당자 멀티 구분자<br/>(multipleValuesSeparator)</span><select data-opt="special.separator"><option value="">(기본 |)</option><option>,</option><option>/</option><option>;</option></select></label>
          <label><span>showEditableFeedbackFlag</span><input type="checkbox" data-opt="grid.showEditableFeedbackFlag" checked /></label>
          <label><span>editOnKeyPressFlag</span><input type="checkbox" data-opt="grid.editOnKeyPressFlag" checked /></label>
          <label><span>focusNextEditableCellOnTabFlag</span><input type="checkbox" data-opt="grid.focusNextEditableCellOnTabFlag" /></label>
          <label><span>selectNextCellOnEnterFlag</span><input type="checkbox" data-opt="grid.selectNextCellOnEnterFlag" checked /></label>
        </fieldset>
        <fieldset>
          <legend>선택</legend>
          <label><span>rowSelection</span><select data-opt="grid.rowSelection"><option>multiple</option><option>single</option><option>none</option></select></label>
          <label><span>cellSelection</span><select data-opt="grid.cellSelection"><option>multiple</option><option>single</option><option>none</option></select></label>
          <label><span>columnSelection</span><select data-opt="grid.columnSelection"><option>none</option><option>single</option><option>multiple</option></select></label>
          <label><span>showSelectionCheckBoxesFlag</span><select data-opt="grid.showSelectionCheckBoxesFlag"><option>OnOver</option><option value="true">true</option><option value="false">false</option></select></label>
          <label><span>cellActivationFeedback</span><select data-opt="grid.cellActivationFeedback"><option>cell</option><option>row</option><option>none</option></select></label>
          <label><span>selectionStyle</span><select data-opt="grid.selectionStyle"><option value="">(기본)</option><option>lightSelectionEdging</option></select></label>
        </fieldset>
        <fieldset>
          <legend>표시</legend>
          <label><span>showRowIndexFlag</span><input type="checkbox" data-opt="grid.showRowIndexFlag" checked /></label>
          <label><span>showRowBorderFlag</span><input type="checkbox" data-opt="grid.showRowBorderFlag" /></label>
          <label><span>showColumnBorderFlag</span><input type="checkbox" data-opt="grid.showColumnBorderFlag" /></label>
          <label><span>showAlternateBackgroundFlag</span><input type="checkbox" data-opt="grid.showAlternateBackgroundFlag" checked /></label>
          <label><span>showRowHeaderBackgroundFlag</span><input type="checkbox" data-opt="grid.showRowHeaderBackgroundFlag" checked /></label>
          <label><span>showOutlineFlag</span><input type="checkbox" data-opt="grid.showOutlineFlag" /></label>
          <label><span>showModelChangesFlag</span><input type="checkbox" data-opt="grid.showModelChangesFlag" /></label>
          <label><span>showScrollbarsOnHover</span><input type="checkbox" data-opt="grid.showScrollbarsOnHover" /></label>
        </fieldset>
        <fieldset>
          <legend>드래그 / 정렬</legend>
          <label><span>columnDragEnabledFlag</span><input type="checkbox" data-opt="grid.columnDragEnabledFlag" checked /></label>
          <label><span>rowDragEnabledFlag</span><input type="checkbox" data-opt="grid.rowDragEnabledFlag" /></label>
          <label><span>rowReorderEnabledFlag</span><input type="checkbox" data-opt="grid.rowReorderEnabledFlag" checked /></label>
          <label><span>품번 컬럼 pinned</span><select data-opt="special.pinned"><option>unpinned</option><option>left</option><option>right</option></select></label>
          <label><span>진행률 컬럼 alignment</span><select data-opt="special.alignment"><option value="">(기본)</option><option>near</option><option>center</option><option>far</option></select></label>
        </fieldset>
      </div>
      <div class="right">
        <div id="playGrid"></div>
        <div class="logHead">
          <span>이벤트 로그 (grid.addEventListener 로 받은 이벤트, 최신이 위)</span>
          <span><label><input type="checkbox" id="logPointer" /> click / contextmenu / keydown 포함</label> <button id="btnClearLog">지우기</button></span>
        </div>
        <pre id="playLog"></pre>
        <pre id="playCode"></pre>
      </div>
    </div>
  </main>

  <script type="text/javascript">
    /*
     * 실시간 설정
     *   왼쪽 컨트롤 값 → 설정 객체 → new DataGridView(설정) 으로 다시 생성
     *   data-opt 규칙: 'grid.키' = 그리드 옵션, 'layout.키' = layoutOptions, 'special.키' = 컬럼 쪽 설정
     */
    require([
      'DS/DataGridView/DataGridView',
      'DS/TreeModel/TreeDocument',
      'DS/TreeModel/TreeNodeModel'
    ], function (DataGridView, TreeDocument, TreeNodeModel) {
      'use strict';

      var grid = null;

      function createTreeDocument() {
        var treeDocument = new TreeDocument();
        treeDocument.prepareUpdate();
        [
          { label: 'PRT-0001', grid: { title: '브라켓', status: '작업중', owners: ['김철수'], progress: 20, approved: false, note: '1차 설계' } },
          { label: 'PRT-0002', grid: { title: '샤프트', status: '검토중', owners: ['이영희', '박민수'], progress: 55, approved: false, note: '도면 수정 요청이 들어와서 치수와 공차를 다시 검토해야 하는 상태입니다. 긴 문장은 autoRowHeightFlag 로 행 높이가 늘어나는지 확인하세요.' } },
          { label: 'PRT-0003', grid: { title: '하우징', status: '승인', owners: ['박민수'], progress: 100, approved: true, note: '양산 적용' } },
          { label: 'PRT-0004', grid: { title: '커버', status: '작업중', owners: [], progress: 0, approved: false, note: '' } },
          { label: 'PRT-0005', grid: { title: '베어링', status: '폐기', owners: ['최지훈', '김철수'], progress: 80, approved: true, note: '대체품 검토' } },
          { label: 'PRT-0006', grid: { title: '볼트', status: '승인', owners: ['이영희'], progress: 100, approved: true, note: '표준품' } }
        ].forEach(function (row) {
          treeDocument.addRoot(new TreeNodeModel(row));
        });
        treeDocument.pushUpdate();
        return treeDocument;
      }

      function readControls() {
        var values = { grid: {}, layout: {}, special: {} };
        Array.prototype.forEach.call(document.querySelectorAll('#controls [data-opt]'), function (el) {
          var path = el.getAttribute('data-opt').split('.');
          var value;
          if (el.type === 'checkbox') {
            value = el.checked;
          } else if (el.type === 'number') {
            value = Number(el.value);
          } else if (el.value === 'true' || el.value === 'false') {
            value = el.value === 'true';
          } else {
            value = el.value;
          }
          values[path[0]][path[1]] = value;
        });
        return values;
      }

      function buildOptions(values) {
        var s = values.special;
        var layoutOptions = Object.assign({}, values.layout);
        if (s.rowHeightFn) {
          layoutOptions.getRowHeightFunction = function (rowID) {
            return rowID % 2 === 0 ? 50 : undefined;
          };
        }
        var gridOptions = Object.assign({}, values.grid);
        if (gridOptions.selectionStyle === '') {
          delete gridOptions.selectionStyle;
        }
        var progressColumn = { text: '진행률', dataIndex: 'progress', width: 140, typeRepresentation: 'progress', editableFlag: true, editionPolicy: s.editionPolicy };
        if (s.alignment) {
          progressColumn.alignment = s.alignment;
        }
        var ownersSemantics = { possibleValues: ['김철수', '이영희', '박민수', '최지훈'], allowMultipleValuesFlag: true };
        if (s.separator) {
          ownersSemantics.viewOptions = { multipleValuesSeparator: s.separator };
        }
        return Object.assign(gridOptions, {
          layoutOptions: layoutOptions,
          columns: [
            { text: '품번', dataIndex: 'tree', width: 110, pinned: s.pinned },
            { text: '품명', dataIndex: 'title', width: 110, editableFlag: true, editionPolicy: s.editionPolicy },
            { text: '상태 (콤보)', dataIndex: 'status', width: 110, typeRepresentation: 'customEnumMember', editableFlag: true, editionPolicy: s.editionPolicy, semantics: { possibleValues: ['작업중', '검토중', '승인', '폐기'] } },
            { text: '담당자 (멀티)', dataIndex: 'owners', width: 150, typeRepresentation: 'customEnumMember', editableFlag: true, editionPolicy: s.editionPolicy, semantics: ownersSemantics },
            progressColumn,
            { text: '승인', dataIndex: 'approved', width: 70, typeRepresentation: 'boolean', editableFlag: true, editionPolicy: s.editionPolicy },
            { text: '비고', dataIndex: 'note', width: 220, typeRepresentation: 'multilineString', editableFlag: true, editionPolicy: s.editionPolicy, autoRowHeightFlag: s.autoRowHeight }
          ]
        });
      }

      function toCode(options) {
        var json = JSON.stringify(options, function (key, value) {
          return typeof value === 'function' ? '__FN__' + value.toString() + '__FN__' : value;
        }, 2);
        json = json.replace(/"__FN__([\s\S]*?)__FN__"/g, function (match, body) {
          return JSON.parse('"' + body + '"');
        });
        return 'var grid = new DataGridView(' + json.replace(/^\{/, '{\n  "treeDocument": treeDocument,') + ');\ngrid.inject(document.getElementById(\'grid\'));';
      }

      function rebuild() {
        var options = buildOptions(readControls());
        var container = document.getElementById('playGrid');
        if (grid && grid.destroy) {
          grid.destroy();
        }
        container.innerHTML = '';
        grid = new DataGridView(Object.assign({ treeDocument: createTreeDocument() }, options));
        grid.inject(container);
        attachEventLog(grid);
        document.getElementById('playCode').textContent = toCode(options);
      }

      /*
       * 이벤트 로그
       *   grid.addEventListener(이름, function (event, cellInfos) { ... })
       *   셀에서 발생한 이벤트면 cellInfos 에 그 셀의 행/컬럼/값이 들어온다.
       */
      var GRID_EVENTS = [
        'activeCellChange', 'preselectedCellChange', 'allCellsRendered', 'sortModelChange',
        'columnOrderChange', 'columnVisibleStateChange', 'columnWidthChange', 'userPreferencesChange',
        'change', 'liveChange', 'preEdit', 'postEdit', 'buttonclick'
      ];
      var POINTER_EVENTS = ['click', 'dblclick', 'contextmenu', 'keydown'];
      var NOISY_EVENTS = ['preselectedCellChange', 'allCellsRendered'];

      function writeLog(text) {
        var log = document.getElementById('playLog');
        var time = new Date().toTimeString().slice(0, 8);
        log.textContent = time + '  ' + text + '\n' + log.textContent.split('\n').slice(0, 200).join('\n');
      }

      function describeCell(cellInfos) {
        if (!cellInfos) {
          return '';
        }
        var dataIndex = grid.layout.getDataIndexFromColumnIndex(cellInfos.columnID);
        var value = cellInfos.nodeModel && dataIndex ? (dataIndex === 'tree' ? cellInfos.nodeModel.options.label : cellInfos.nodeModel.getAttributeValue(dataIndex)) : undefined;
        return '  ← 셀 rowID=' + cellInfos.rowID + ', columnID=' + cellInfos.columnID + ', dataIndex=' + dataIndex
          + (cellInfos.nodeModel ? ', 행=' + cellInfos.nodeModel.options.label : '')
          + (value !== undefined ? ', 값=' + JSON.stringify(value) : '');
      }

      function attachEventLog(target) {
        GRID_EVENTS.concat(POINTER_EVENTS).forEach(function (name) {
          target.addEventListener(name, function (event, cellInfos) {
            if (POINTER_EVENTS.indexOf(name) > -1 && !document.getElementById('logPointer').checked) {
              return;
            }
            if (NOISY_EVENTS.indexOf(name) > -1 && document.getElementById('playLog').textContent.indexOf(name) === 10) {
              return;
            }
            var extra = event.options && Object.keys(event.options).length ? '  options=' + JSON.stringify(event.options) : '';
            writeLog(name + extra + describeCell(cellInfos));
          });
        });
        target.treeDocument.getXSO().onPostAdd(function () {
          writeLog('[treeDocument] 선택 추가 → 선택 행: ' + target.treeDocument.getSelectedNodes().map(function (n) { return n.options.label; }).join(', '));
        });
        target.treeDocument.getXSO().onPostRemove(function () {
          writeLog('[treeDocument] 선택 해제 → 선택 행: ' + target.treeDocument.getSelectedNodes().map(function (n) { return n.options.label; }).join(', '));
        });
      }

      document.getElementById('btnClearLog').addEventListener('click', function () {
        document.getElementById('playLog').textContent = '';
      });
      document.getElementById('controls').addEventListener('change', rebuild);
      rebuild();
    });
  </script>
</body>
</html>
