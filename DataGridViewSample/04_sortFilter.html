<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>04. 정렬 / 필터</title>
  <link rel="stylesheet" type="text/css" href="../Core/wux.css" />
  <script type="text/javascript" src="../AmdLoader/AmdLoader.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    .page { display: flex; flex-direction: column; height: 100%; padding: 12px; box-sizing: border-box; }
    .page h2 { margin: 0 0 8px; font-size: 16px; }
    .page p { margin: 0 0 8px; font-size: 12px; color: #555; }
    .buttons { margin: 0 0 8px; }
    .buttons button { margin-right: 4px; }
    #grid { position: relative; flex: 1; min-height: 320px; border: 1px solid #d1d4d4; }
  </style>
</head>
<body>
  <div class="page">
    <h2>04. 정렬 / 필터</h2>
    <p>
      헤더 클릭 = 정렬 (오름차순 → 내림차순 → 원래 순서), Ctrl + 헤더 클릭 = 다중 정렬, 헤더의 필터 아이콘 또는 우클릭 메뉴 = 컬럼 필터.
      처음 열면 [상태 오름차순 → 진행률 내림차순] 으로 정렬되어 있습니다. <a href="index.html">목록으로</a>
    </p>
    <div class="buttons">
      <button id="btnSortPriority">우선순위(사용자 정의 순서) 정렬</button>
      <button id="btnSortDue">납기 오름차순 정렬</button>
      <button id="btnSortClear">정렬 해제</button>
    </div>
    <div id="grid"></div>
  </div>

  <script type="text/javascript">
    require([
      'DS/DataGridView/DataGridView',
      'DS/TreeModel/TreeDocument',
      'DS/TreeModel/TreeNodeModel'
    ], function (DataGridView, TreeDocument, TreeNodeModel) {
      'use strict';

      /* 우선순위 컬럼의 사용자 정의 정렬 순서 (문자 순서가 아닌 업무 순서) */
      var PRIORITY_ORDER = { '높음': 1, '보통': 2, '낮음': 3 };

      var treeDocument = new TreeDocument();
      treeDocument.prepareUpdate();
      [
        { label: 'PRT-0001', grid: { title: '브라켓',   status: '작업중', priority: '보통', progress: 20,  qty: 10, dueDate: new Date(2026, 10, 10), note: '1차 설계' } },
        { label: 'PRT-0002', grid: { title: '샤프트',   status: '검토중', priority: '높음', progress: 55,  qty: 4,  dueDate: new Date(2026, 10, 20), note: '도면 수정' } },
        { label: 'PRT-0003', grid: { title: '하우징',   status: '승인',   priority: '낮음', progress: 100, qty: 1,  dueDate: new Date(2026, 9, 31),  note: '양산 적용' } },
        { label: 'PRT-0004', grid: { title: '커버',     status: '작업중', priority: '높음', progress: 0,   qty: 2,  dueDate: new Date(2026, 11, 5),  note: '' } },
        { label: 'PRT-0005', grid: { title: '베어링',   status: '폐기',   priority: '보통', progress: 80,  qty: 8,  dueDate: new Date(2026, 11, 15), note: '대체품 검토' } },
        { label: 'PRT-0006', grid: { title: '볼트',     status: '승인',   priority: '낮음', progress: 100, qty: 50, dueDate: new Date(2026, 8, 30),  note: '표준품' } },
        { label: 'PRT-0007', grid: { title: '너트',     status: '작업중', priority: '보통', progress: 45,  qty: 50, dueDate: new Date(2026, 10, 25), note: '표준품' } },
        { label: 'ASM-0001', grid: { title: '구동 어셈블리', status: '검토중', priority: '높음', progress: 70, qty: 1, dueDate: new Date(2026, 11, 1), note: '조립 검토' } }
      ].forEach(function (row) {
        treeDocument.addRoot(new TreeNodeModel(row));
      });

      /*
       * [필터 설정]
       *   DataGridView 에는 필터용 생성자 옵션이 없고, 데이터(TreeDocument) 에 setFilterModel 로 지정한다.
       *   (DataGridView.js 내부에서도 같은 방식으로 사용: treeDocument.setFilterModel({ label: { filterId: 'string' } }))
       *   여기서 지정한 컬럼만 헤더에 필터 기능이 생긴다.
       *
       *   키      : 컬럼의 dataIndex. 단 첫 트리 컬럼(dataIndex 'tree')은 'label' 로 지정한다.
       *   filterId:
       *     'string'             문자열 포함 검색
       *     'stringRegexp'       문자열 검색 (정규식/와일드카드 지원, ENOVIA 앱에서 가장 많이 사용)
       *     'set'                값 목록 체크박스 (콤보 성격의 컬럼에 적합)
       *     'number'             숫자 범위
       *     'numberWithCondition' 숫자 조건 (=, >, < 등)
       *     'date'               날짜 범위
       *     'dateWithCondition'  날짜 조건
       */
      treeDocument.setFilterModel({
        label:    { filterId: 'stringRegexp' },
        title:    { filterId: 'string' },
        status:   { filterId: 'set' },
        priority: { filterId: 'set' },
        progress: { filterId: 'numberWithCondition' },
        qty:      { filterId: 'number' },
        dueDate:  { filterId: 'date' }
      });
      treeDocument.pushUpdate();

      var grid = new DataGridView({
        treeDocument: treeDocument,

        /*
         * [정렬 설정]
         *   sortModel   : 처음 열 때 적용할 정렬. 배열 순서 = 정렬 우선순위
         *                 { dataIndex: 컬럼 키, sort: 'asc' | 'desc' }
         *   sortOptions : maxSortedColumnsCount = 동시에 정렬할 수 있는 최대 컬럼 수
         */
        sortModel: [
          { dataIndex: 'status', sort: 'asc' },
          { dataIndex: 'progress', sort: 'desc' }
        ],
        sortOptions: { maxSortedColumnsCount: 3 },

        columns: [
          { text: '품번',   dataIndex: 'tree',     width: 120 },
          { text: '품명',   dataIndex: 'title',    width: 150 },
          { text: '상태',   dataIndex: 'status',   width: 100 },

          /*
           * 사용자 정의 정렬 : compareFunction(값A, 값B, 행A, 행B, dataIndex)
           *   음수 = A 가 앞, 양수 = B 가 앞, 0 = 같음
           *   내림차순일 때는 그리드가 결과에 -1 을 곱해 준다.
           */
          {
            text: '우선순위',
            dataIndex: 'priority',
            width: 100,
            compareFunction: function (a, b) {
              return (PRIORITY_ORDER[a] || 99) - (PRIORITY_ORDER[b] || 99);
            }
          },

          { text: '진행률', dataIndex: 'progress', width: 140, typeRepresentation: 'progress' },
          { text: '수량',   dataIndex: 'qty',      width: 80,  typeRepresentation: 'integer' },
          { text: '납기',   dataIndex: 'dueDate',  width: 120, typeRepresentation: 'date' },

          /* 정렬 금지 컬럼 : sortableFlag: false (헤더를 눌러도 정렬되지 않음) */
          { text: '비고 (정렬 불가)', dataIndex: 'note', width: 160, sortableFlag: false }
        ]
      });
      grid.inject(document.getElementById('grid'));

      /*
       * [실행 중 정렬 변경]
       *   sortModel 은 속성이므로 값을 대입하면 바로 다시 정렬된다. 빈 배열 = 정렬 해제
       */
      document.getElementById('btnSortPriority').addEventListener('click', function () {
        grid.sortModel = [{ dataIndex: 'priority', sort: 'asc' }];
      });
      document.getElementById('btnSortDue').addEventListener('click', function () {
        grid.sortModel = [{ dataIndex: 'dueDate', sort: 'asc' }];
      });
      document.getElementById('btnSortClear').addEventListener('click', function () {
        grid.sortModel = [];
      });
    });
  </script>
</body>
</html>
