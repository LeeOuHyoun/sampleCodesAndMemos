<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ExpandableSearchPanel + 그리드</title>
  <link rel="stylesheet" type="text/css" href="../../Core/wux.css" />
  <script type="text/javascript" src="../../AmdLoader/AmdLoader.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    .page { display: flex; flex-direction: column; height: 100%; padding: 12px; box-sizing: border-box; }
    #grid { position: relative; flex: 1; min-height: 200px; border: 1px solid #d1d4d4; }
  </style>
</head>
<body>
  <div class="page">
    <div id="searchPanel"></div>
    <div id="grid"></div>
  </div>

  <script type="text/javascript">
    require([
      'DS/CommonUtils/ExpandableSearchPanel/ExpandableSearchPanel',
      'DS/DataGridView/DataGridView',
      'DS/TreeModel/TreeDocument',
      'DS/TreeModel/TreeNodeModel'
    ], (ExpandableSearchPanel, DataGridView, TreeDocument, TreeNodeModel) => {
      'use strict';

      const treeDocument = new TreeDocument();
      treeDocument.prepareUpdate();
      [
        { label: 'PRT-0001', grid: { title: '브라켓', status: '작업중' } },
        { label: 'PRT-0002', grid: { title: '샤프트', status: '검토중' } },
        { label: 'PRT-0003', grid: { title: '하우징', status: '승인' } }
      ].forEach((row) => treeDocument.addRoot(new TreeNodeModel(row)));
      treeDocument.pushUpdate();

      new DataGridView({
        treeDocument,
        columns: [
          { text: '품번', dataIndex: 'tree', width: 130 },
          { text: '품명', dataIndex: 'title', width: 160 },
          { text: '상태', dataIndex: 'status', width: 120 }
        ]
      }).inject(document.getElementById('grid'));

      ExpandableSearchPanel.create(document.getElementById('searchPanel'), {
        fields: Array.from({ length: 12 }, (_, index) => ({ id: `item${index + 1}`, label: `item${index + 1}`, type: 'text' })),
        onSearch: (values) => console.log('검색', values)
      });
    });
  </script>
</body>
</html>
