<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>07. 컬럼 함수</title>
  <link rel="stylesheet" type="text/css" href="../Core/wux.css" />
  <script type="text/javascript" src="../AmdLoader/AmdLoader.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    .page { display: flex; flex-direction: column; height: 100%; padding: 12px; box-sizing: border-box; }
    .page h2 { margin: 0 0 8px; font-size: 16px; }
    .page p { margin: 0 0 8px; font-size: 12px; color: #555; }
    .legend span { display: inline-block; margin-right: 12px; padding: 1px 6px; }
    #grid { flex: 1; min-height: 320px; border: 1px solid #d1d4d4; }

    /* getCellClassName 이 돌려주는 클래스. 그리드가 셀 요소에 붙여 주므로 모양은 페이지에서 정한다. */
    .cell-warn { background: #fde9e6 !important; color: #b3261e; font-weight: bold; }
    .cell-done { background: #e8f5e4 !important; }
    .cell-locked { color: #9a9c9e; font-style: italic; }
  </style>
</head>
<body>
  <div class="page">
    <h2>07. 컬럼 함수 (셀마다 다른 값, 타입, 콤보 목록, 편집 가능 여부, 모양, 툴팁)</h2>
    <p>
      컬럼 옵션에 고정값 대신 함수를 넣으면 행마다 다르게 정할 수 있습니다. 수량이나 단가를 편집해서 금액이 따라 바뀌는지, 상태가 "승인" 인 행이 잠기는지 확인하세요.
      <a href="index.html">목록으로</a>
    </p>
    <p class="legend">
      <span class="cell-warn">진행률 30 미만</span>
      <span class="cell-done">진행률 100</span>
      <span class="cell-locked">승인되어 잠긴 셀</span>
    </p>
    <div id="grid"></div>
  </div>

  <script type="text/javascript">
    require([
      'DS/DataGridView/DataGridView',
      'DS/TreeModel/TreeDocument',
      'DS/TreeModel/TreeNodeModel'
    ], function (DataGridView, TreeDocument, TreeNodeModel) {
      'use strict';

      /* 종류(kind)별 재질 콤보 목록 : 행마다 다른 콤보 목록의 재료 */
      var MATERIALS_BY_KIND = {
        '금속': ['SS400', 'S45C', 'AL6061', 'SUS304'],
        '수지': ['ABS', 'PC', 'POM'],
        '전장': ['FR-4', 'CEM-3']
      };

      /*
       * 검사값 컬럼은 행마다 타입이 다르다.
       *   checkType 'N' = 숫자, 'B' = 예/아니오, 'T' = 글자
       */
      var treeDocument = new TreeDocument();
      treeDocument.prepareUpdate();
      [
        { label: 'PRT-0001', grid: { title: '브라켓', kind: '금속', material: 'SS400',  qty: 10, price: 1200,  status: '작업중', progress: 20,  owner: '김철수', checkType: 'N', checkValue: 12 } },
        { label: 'PRT-0002', grid: { title: '샤프트', kind: '금속', material: 'S45C',   qty: 4,  price: 8500,  status: '검토중', progress: 55,  owner: '이영희', checkType: 'N', checkValue: 30 } },
        { label: 'PRT-0003', grid: { title: '하우징', kind: '금속', material: 'AL6061', qty: 1,  price: 42000, status: '승인',   progress: 100, owner: '박민수', checkType: 'B', checkValue: true } },
        { label: 'PRT-0004', grid: { title: '커버',   kind: '수지', material: 'ABS',    qty: 2,  price: 3100,  status: '작업중', progress: 0,   owner: '김철수', checkType: 'B', checkValue: false } },
        { label: 'PRT-0005', grid: { title: '기판',   kind: '전장', material: 'FR-4',   qty: 8,  price: 15000, status: '승인',   progress: 100, owner: '최지훈', checkType: 'T', checkValue: '외관 양호' } },
        { label: 'DOC-0001', grid: { title: '조립 설명서', kind: '문서', status: '작업중', progress: 70, owner: '이영희', checkType: 'T', checkValue: '' } }
      ].forEach(function (row) {
        treeDocument.addRoot(new TreeNodeModel(row));
      });
      treeDocument.pushUpdate();

      /*
       * [공통] 컬럼 함수가 받는 cellInfos
       *   cellInfos.nodeModel : 행 (TreeNodeModel). 값은 nodeModel.options.grid.키 로 읽는다.
       *   cellInfos.rowID / columnID / cellID
       *
       *   함수에 따라 컬럼 헤더 셀(rowID -1)에도 호출되고, 그때는 nodeModel 이 없다.
       *   (예: DataGridView.getCellCssClassesAt 은 rowID 를 가리지 않고 getCellClassName 을 부른다)
       *   그래서 실제 ENOVIA 앱처럼 nodeModel 이 있는지 먼저 확인한다.
       */
      // #region rowOf
      function rowOf(cellInfos) {
        return cellInfos && cellInfos.nodeModel ? cellInfos.nodeModel.options.grid : null;
      }

      function isLocked(cellInfos) {
        var row = rowOf(cellInfos);
        return !!row && row.status === '승인';
      }
      // #endregion rowOf

      var grid = new DataGridView({
        treeDocument: treeDocument,
        showColumnBorderFlag: true,
        columns: [
          { text: '품번', dataIndex: 'tree', width: 110, pinned: 'left' },
          { text: '품명', dataIndex: 'title', width: 110 },
          { text: '종류', dataIndex: 'kind', width: 70 },

          /*
           * [1] getCellSemantics : 행마다 다른 콤보 목록
           *   돌려준 객체가 컬럼의 semantics 대신 쓰인다.
           *
           * [2] getCellEditableState : 행마다 편집 가능 여부
           *   false 를 돌려주면 그 셀은 편집되지 않는다. editableFlag: true 인 컬럼에서만 의미가 있다.
           */
          // #region semantics
          {
            text: '재질 (행마다 다른 콤보)',
            dataIndex: 'material',
            width: 170,
            typeRepresentation: 'customEnumMember',
            editableFlag: true,
            editionPolicy: 'EditionOnClick',
            getCellSemantics: function (cellInfos) {
              var row = rowOf(cellInfos);
              return { possibleValues: (row && MATERIALS_BY_KIND[row.kind]) || [] };
            },
            getCellEditableState: function (cellInfos) {
              var row = rowOf(cellInfos);
              return !!row && !!MATERIALS_BY_KIND[row.kind] && !isLocked(cellInfos);
            },
            getCellClassName: function (cellInfos) {
              return isLocked(cellInfos) ? 'cell-locked' : '';
            }
          },
          // #endregion semantics

          /*
           * [3] hasCellValue : false 를 돌려주면 그 셀은 빈 칸이 된다 (getCellValue 도 불리지 않는다).
           *     문서 행에는 수량, 단가, 금액이 없다.
           */
          // #region hasValue
          {
            text: '수량', dataIndex: 'qty', width: 70, typeRepresentation: 'integer', editableFlag: true,
            hasCellValue: function (cellInfos) {
              var row = rowOf(cellInfos);
              return !!row && row.kind !== '문서';
            },
            getCellEditableState: function (cellInfos) {
              return !isLocked(cellInfos);
            }
          },
          {
            text: '단가', dataIndex: 'price', width: 90, typeRepresentation: 'integer', editableFlag: true,
            hasCellValue: function (cellInfos) {
              var row = rowOf(cellInfos);
              return !!row && row.kind !== '문서';
            },
            getCellEditableState: function (cellInfos) {
              return !isLocked(cellInfos);
            }
          },
          // #endregion hasValue

          /*
           * [4] getCellValue : 데이터에 없는 값을 계산해서 표시
           *   dataIndex 'amount' 는 행 데이터(grid)에 없는 키다. 표시할 값을 함수가 돌려준다.
           *
           * [5] getCellValueForSort : 정렬에 쓸 값
           *   인자가 cellInfos 가 아니라 (nodeModel, dataIndex) 인 것에 주의.
           *   계산 컬럼은 데이터에 값이 없으므로 이 함수가 없으면 정렬할 값이 없다.
           */
          // #region computed
          {
            text: '금액 (수량 × 단가)',
            dataIndex: 'amount',
            width: 130,
            typeRepresentation: 'integer',
            alignment: 'far',
            getCellValue: function (cellInfos) {
              var row = rowOf(cellInfos);
              return row && row.kind !== '문서' ? row.qty * row.price : undefined;
            },
            getCellValueForSort: function (nodeModel) {
              var row = nodeModel.options.grid;
              return row.kind === '문서' ? 0 : row.qty * row.price;
            }
          },
          // #endregion computed

          { text: '상태', dataIndex: 'status', width: 80 },

          /*
           * [6] getCellClassName : 조건에 따라 셀에 CSS 클래스 붙이기
           *   클래스 이름만 돌려준다. 색, 굵기 같은 모양은 페이지 CSS 에 정의한다. (이 파일 위쪽 style)
           *
           * [7] getCellTooltip : 셀 툴팁
           *   { shortHelp: '글자' } 를 돌려준다. 이 함수는 this 없이 호출된다.
           *   그리드 옵션 getCellTooltip 을 같이 넣으면 그리드 쪽만 호출되고 컬럼 쪽은 무시된다.
           *   (DataGridView._getCellTooltip)
           */
          // #region style
          {
            text: '진행률 (조건부 모양)',
            dataIndex: 'progress',
            width: 150,
            typeRepresentation: 'integer',
            getCellClassName: function (cellInfos) {
              var row = rowOf(cellInfos);
              if (!row) {
                return '';
              }
              if (row.progress < 30) {
                return 'cell-warn';
              }
              return row.progress === 100 ? 'cell-done' : '';
            },
            getCellTooltip: function (cellInfos) {
              var row = rowOf(cellInfos);
              return { shortHelp: row ? '담당: ' + row.owner + ' / 진행률 ' + row.progress + '%' : '진행률' };
            }
          },
          // #endregion style

          /*
           * [8] getCellTypeRepresentation : 행마다 다른 셀 타입
           *   typeRepresentation 문자열을 돌려준다. 편집기도 그 타입에 맞게 바뀐다.
           */
          // #region cellType
          {
            text: '검사값 (행마다 다른 타입)',
            dataIndex: 'checkValue',
            width: 180,
            editableFlag: true,
            editionPolicy: 'EditionOnClick',
            getCellTypeRepresentation: function (cellInfos) {
              var row = rowOf(cellInfos);
              if (row && row.checkType === 'N') {
                return 'integer';
              }
              return row && row.checkType === 'B' ? 'boolean' : 'string';
            }
          }
          // #endregion cellType
        ]
      });
      grid.inject(document.getElementById('grid'));
    });
  </script>
</body>
</html>
