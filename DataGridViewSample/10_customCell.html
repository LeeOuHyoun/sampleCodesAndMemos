<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>10. 셀 직접 그리기와 상태바</title>
  <link rel="stylesheet" type="text/css" href="../Core/wux.css" />
  <script type="text/javascript" src="../AmdLoader/AmdLoader.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; }
    .page { display: flex; flex-direction: column; height: 100%; padding: 12px; box-sizing: border-box; }
    .page h2 { margin: 0 0 8px; font-size: 16px; }
    .page p { margin: 0 0 8px; font-size: 12px; color: #555; }
    #grid { position: relative; flex: 1; min-height: 320px; border: 1px solid #d1d4d4; }

    /* 직접 그리는 셀의 모양. 그리드는 내용을 셀에 넣어 주기만 하므로 모양은 페이지에서 정한다. */
    .status-chip { display: inline-block; margin: 3px 8px; padding: 1px 10px; border-radius: 10px; font-size: 12px; color: #fff; cursor: pointer; }
    .status-chip[data-status="작업중"] { background: #368ec4; }
    .status-chip[data-status="검토중"] { background: #e87b00; }
    .status-chip[data-status="승인"] { background: #57b847; }
    .status-chip[data-status="폐기"] { background: #77797c; }
    .progress-cell { display: flex; align-items: center; height: 100%; padding: 0 8px; box-sizing: border-box; }
    .progress-cell .track { flex: 1; height: 8px; background: #e2e4e6; border-radius: 4px; overflow: hidden; }
    .progress-cell .bar { height: 100%; background: #368ec4; }
    .progress-cell .text { width: 44px; text-align: right; font-size: 12px; }
  </style>
</head>
<body>
  <div class="page">
    <h2>10. 셀 직접 그리기와 상태바</h2>
    <p>
      상태 컬럼과 진행률 컬럼은 편집기(typeRepresentation) 대신 직접 만든 화면 요소로 그립니다. 상태 칩을 클릭하면 다음 상태로 바뀌고, 아래 상태바의 "승인" 건수가 따라 바뀝니다.
      <a href="index.html">목록으로</a>
    </p>
    <div id="grid"></div>
  </div>

  <script type="text/javascript">
    require([
      'DS/DataGridView/DataGridView',
      'DS/CollectionView/CollectionViewStatusBar',
      'DS/TreeModel/TreeDocument',
      'DS/TreeModel/TreeNodeModel'
    ], function (DataGridView, CollectionViewStatusBar, TreeDocument, TreeNodeModel) {
      'use strict';

      var STATUSES = ['작업중', '검토중', '승인', '폐기'];

      var treeDocument = new TreeDocument();
      treeDocument.prepareUpdate();
      [
        { label: 'PRT-0001', grid: { title: '브라켓', status: '작업중', progress: 20 } },
        { label: 'PRT-0002', grid: { title: '샤프트', status: '검토중', progress: 55 } },
        { label: 'PRT-0003', grid: { title: '하우징', status: '승인',   progress: 100 } },
        { label: 'PRT-0004', grid: { title: '커버',   status: '작업중', progress: 0 } },
        { label: 'PRT-0005', grid: { title: '베어링', status: '폐기',   progress: 80 } },
        { label: 'PRT-0006', grid: { title: '볼트',   status: '승인',   progress: 100 } }
      ].forEach(function (row) {
        treeDocument.addRoot(new TreeNodeModel(row));
      });
      treeDocument.pushUpdate();

      /*
       * [1] 그리드
       *   컬럼에 onCellRequest(cellInfos) 를 넣으면 그 컬럼의 셀은 기본 렌더링 대신 이 함수가 그린다.
       *     - 데이터 행의 셀(rowID 0 이상)에서만 호출된다. 컬럼 헤더는 기본 렌더링 그대로다.
       *       (DataGridView._manageCellRequests)
       *     - 함수 안의 this 는 그리드다.
       *     - cellInfos.cellView 가 그 셀의 화면 요소 관리 객체다.
       *
       *   그리드는 보이는 셀만 만들고 스크롤할 때 다시 쓴다. 그래서 셀 내용은 매번 새로 만들지 않고
       *   "미리 등록해 둔 내용" 을 꺼내서 값만 바꿔 넣는다.
       *     this.reuseCellContent('등록 id')           등록한 내용 하나를 꺼낸다 (없으면 buildContent 로 만든다)
       *     cellInfos.cellView.setReusableContent(내용) 셀에 넣는다. 전에 있던 내용은 그리드가 회수한다.
       */
      // #region grid
      var grid = new DataGridView({
        treeDocument: treeDocument,
        columns: [
          { text: '품번', dataIndex: 'tree', width: 140 },
          { text: '품명', dataIndex: 'title', width: 180 },
          {
            text: '상태 (칩, 클릭하면 변경)',
            dataIndex: 'status',
            width: 170,
            onCellRequest: function (cellInfos) {
              var chip = this.reuseCellContent('statusChip');
              var status = cellInfos.nodeModel.getAttributeValue('status');
              chip.textContent = status;
              chip.setAttribute('data-status', status);
              cellInfos.cellView.setReusableContent(chip);
            }
          },
          {
            text: '진행률 (막대)',
            dataIndex: 'progress',
            width: 220,
            onCellRequest: function (cellInfos) {
              var content = this.reuseCellContent('progressBar');
              var progress = cellInfos.nodeModel.getAttributeValue('progress');
              content.querySelector('.bar').style.width = progress + '%';
              content.querySelector('.text').textContent = progress + '%';
              cellInfos.cellView.setReusableContent(content);
            }
          }
        ]
      });
      // #endregion grid

      /*
       * [2] 셀 내용 등록
       *   grid.registerReusableCellContent({ id, buildContent, cleanContent })
       *     id           : reuseCellContent 에 넘길 이름
       *     buildContent : 내용 하나를 만들어 돌려준다. 화면 요소(HTMLElement) 또는 WebUX 컨트롤
       *     cleanContent : 회수할 때 호출된다 (생략 가능). 이벤트 해제 등 뒷정리에 쓴다.
       *   onCellRequest 가 처음 불리기 전에 등록해야 하므로 inject 보다 먼저 한다.
       */
      // #region register
      grid.registerReusableCellContent({
        id: 'statusChip',
        buildContent: function () {
          var chip = document.createElement('span');
          chip.className = 'status-chip';
          return chip;
        }
      });
      grid.registerReusableCellContent({
        id: 'progressBar',
        buildContent: function () {
          var content = document.createElement('div');
          content.className = 'progress-cell';
          content.innerHTML = '<div class="track"><div class="bar"></div></div><div class="text"></div>';
          return content;
        }
      });
      // #endregion register

      /*
       * [3] 상태바
       *   grid.buildStatusBar([ 항목, ... ]) : 그리드 아래에 상태바를 만든다. 다시 부르면 통째로 바뀐다.
       *     type : CollectionViewStatusBar.STATUS 의 값
       *       NB_ITEMS                   전체 행 수 (그리드가 알아서 갱신)
       *       NB_SELECTED_ROWS           선택 행 수 (그리드가 알아서 갱신)
       *       NB_VISIBLE_ITEMS / NB_SELECTED_AND_TOTAL_ROWS / NB_SELECTED_CELLS / ACTIVE_CELL / PAGINATION
       *       CUSTOM                     직접 넣는 항목. id 와 dataElements 를 준다 (툴바 항목과 같은 형식)
       *     position : 'near'(왼쪽, 기본) / 'far'(오른쪽)
       */
      // #region statusBar
      function approvedText() {
        var count = treeDocument.getAllDescendants().filter(function (node) {
          return node.getAttributeValue('status') === '승인';
        }).length;
        return '승인 ' + count + '건';
      }

      grid.buildStatusBar([
        { type: CollectionViewStatusBar.STATUS.NB_ITEMS },
        { type: CollectionViewStatusBar.STATUS.NB_SELECTED_ROWS },
        {
          type: CollectionViewStatusBar.STATUS.CUSTOM,
          id: 'approvedCount',
          position: 'far',
          dataElements: { typeRepresentation: 'string', value: approvedText() }
        }
      ]);
      grid.inject(document.getElementById('grid'));
      // #endregion statusBar

      /*
       * [4] 직접 그린 셀의 클릭 처리와 상태바 갱신
       *   grid.addEventListener('click', function (event, cellInfos) { ... })
       *     셀 안에서 클릭하면 두 번째 인자로 그 셀의 cellInfos 가 온다.
       *     event.target 으로 셀 안의 어느 요소를 눌렀는지 구분한다.
       *
       *   행 값을 바꾸면(updateOptions) 그리드가 그 행을 다시 그리면서 onCellRequest 를 다시 부른다.
       *
       *   직접 넣은 상태바 항목은 직접 갱신한다.
       *     grid.elements.statusBar.updateNodeModel('항목 id', { grid: { data: '새 글자' } })
       */
      // #region click
      grid.addEventListener('click', function (event, cellInfos) {
        if (!cellInfos || !cellInfos.nodeModel || !event.target.classList.contains('status-chip')) {
          return;
        }
        var node = cellInfos.nodeModel;
        var nextStatus = STATUSES[(STATUSES.indexOf(node.getAttributeValue('status')) + 1) % STATUSES.length];
        node.updateOptions({ grid: { status: nextStatus } });
        grid.elements.statusBar.updateNodeModel('approvedCount', { grid: { data: approvedText() } });
      });
      // #endregion click
    });
  </script>
</body>
</html>
